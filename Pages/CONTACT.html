<!DOCTYPE html>
<html>
	<head>
		<title>Contact Us - FORGE</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style type="text/css">
			* {
				box-sizing: border-box;
			}

			body {
				background-image: linear-gradient(rgba(8, 27, 45, 0.58), rgba(8, 27, 45, 0.7)), url("../Images/contactbacground.jpg");
				background-size: cover;
				background-position: center;
				background-repeat: no-repeat;
				background-attachment: fixed;
				color: white;
				font-family: "Trebuchet MS", Arial, sans-serif;
				margin: 0;
			}

			header {
				background: rgba(16, 42, 67, 0.72);
				border-bottom: 1px solid rgba(255, 255, 255, 0.2);
			}

			nav {
				padding: 22px clamp(24px, 6vw, 90px);
			}

			nav ul {
				list-style: none;
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 12px;
				margin: 0;
				padding: 0;
			}

			nav a, .btn-back {
				color: white;
				display: block;
				padding: 10px 18px;
				border: 1px solid rgba(255, 255, 255, 0.65);
				border-radius: 999px;
				font-weight: bold;
				text-decoration: none;
				transition: 0.2s;
			}

			nav a:hover, nav a:focus, .btn-back:hover, .btn-back:focus {
				background: #ff8c00;
				border-color: #ff8c00;
				color: #102a43;
			}

			.contact-wrapper {
				width: min(1100px, calc(100% - 48px));
				margin: 0 auto;
				padding: 58px 0 70px;
			}
            h2{
                color:#ff8c00;
            }

			.contact-wrapper > h2 {
				color: #ff8c00;
				font-size: clamp(2rem, 5vw, 3.5rem);
				margin: 0 0 12px;
				text-align: center;
			}

			.contact-wrapper > p {
				max-width: 720px;
				margin: 0 auto 32px;
				line-height: 1.7;
				text-align: center;
			}
            
			.contact-container {
				display: grid;
				grid-template-columns: minmax(0, 1fr) minmax(280px, 0.85fr);
				gap: 28px;
				align-items: stretch;
			}

			.contact-card, .contact-image {
				background: rgba(16, 42, 67, 0.88);
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 14px;
				box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
			}

			.contact-card {
				padding: 28px;
			}

			.contact-card h3 {
				color: #ff8c00;
				margin: 0 0 22px;
			}

			.form-group {
				margin-bottom: 16px;
			}

			label {
				display: block;
				font-weight: bold;
				margin-bottom: 6px;
			}

			input, select, textarea {
				width: 100%;
				padding: 11px 12px;
				border: 1px solid rgba(255, 255, 255, 0.45);
				border-radius: 8px;
				background: rgba(255, 255, 255, 0.95);
				color: #102a43;
				font: inherit;
			}

			textarea {
				resize: vertical;
			}

			.btn-send {
				padding: 13px 24px;
				border: 0;
				border-radius: 999px;
				background: #ff8c00;
				color: #102a43;
				cursor: pointer;
				font-weight: bold;
			}

			.btn-send:hover, .btn-send:focus {
				background: white;
			}

			.contact-image {
				overflow: hidden;
				padding-bottom: 20px;
				text-align: center;
			}

			.contact-image img {
				display: block;
				width: 100%;
				height: auto;
			}

			.contact-image p {
				margin: 20px 18px 0;
				color: #ff8c00;
			}

			.btn-back {
				width: fit-content;
				margin: 28px auto 0;
			}

			@media (max-width: 760px) {
				.contact-container {
					grid-template-columns: 1fr;
				}

				
			}
		</style>
	</head>
	<body>
		<header>
		
		</header>
	
		<div class="contact-wrapper">
			<h2>Get In Touch With FORGE</h2>
			<p>We're here to help! Whether you have questions, technical issues, or feedback regarding FORGE, send us a message below and we'll get back to you as soon as possible.</p>

			<div class="contact-container">
				
				<div class="contact-card">
					<h3>Send Us a Message</h3>
					<form id="contact-form" method="POST" onsubmit="handleContactSubmit(event)">
						<div class="form-group">
							<label for="contact-name">Full Name</label>
							<input type="text" id="contact-name" name="name" placeholder="Enter your name" required>
						</div>

						<div class="form-group">
							<label for="contact-email">Email Address</label>
							<input type="email" id="contact-email" name="email" placeholder="Enter your email" required>
						</div>

						<div class="form-group">
							<label for="contact-phone">Phone Number (Optional)</label>
							<input type="tel" id="contact-phone" name="phone" placeholder="Enter your phone number">
						</div>

						<div class="form-group">
							<label for="contact-subject">Subject / Inquiry Type</label>
							<select id="contact-subject" name="subject" required>
								<option value="">--Select an Option--</option>
								<option value="General Inquiry">General Inquiry</option>
								<option value="Technical Support">Technical Support / Bug Report</option>
								<option value="Feature Request">Feature Request</option>
								<option value="Academic Pressure">Academic Pressure Support</option>
								<option value="Other">Other</option>
							</select>
						</div>

						<div class="form-group">
							<label for="contact-message">Message</label>
							<textarea id="contact-message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
						</div>

						<button type="submit" class="btn-send">Send Message</button>
					</form>
				
			</div>

			<div class="contact-image">
				<img src="../Images/contactbacground.jpg" alt="Contact Us">
				<p><em>We're here to support you - contact us anytime</em></p>
			</div>

			<a href="DASHBOARD.html" class="btn-back">Back to Dashboard</a>
		</div>

	<script>
		function handleContactSubmit(event) {
			event.preventDefault();
			alert('Thank you for your message! We will get back to you soon.');
			document.getElementById('contact-form').reset();
		}
	</script>
	</body>
</html>
